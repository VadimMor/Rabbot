server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service-public
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
            
        - id: auth-service-secured
          uri: http://localhost:8081
          predicates:
            - Path=/api/workspace/**
          filters:
            - JwtAuthenticationFilter