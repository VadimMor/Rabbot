# CI: сборка и тесты бэкенда на каждый push и Pull Request.
name: CI

on:
  push:
    branches: [main, backend]
    # Не гонять сборку из-за правок README, дизайна и т. п.
    paths:
      - "backend/**"
      - "db/**"                      # тесты накатывают миграции из db/migration
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "db/**"
      - ".github/workflows/ci.yml"
  # Кнопка "Run workflow" во вкладке Actions — запустить вручную.
  workflow_dispatch:

# Минимальные права токена: только читать код.
permissions:
  contents: read

# Новый push в ту же ветку отменяет ещё идущую сборку — не тратим минуты зря.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — build & tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Все команды run выполняются из папки backend (там settings.gradle.kts).
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # JDK 25 — тот же, что локально. Temurin — бесплатная сборка OpenJDK.
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      # Ставит Gradle нужной версии и кэширует зависимости между запусками.
      # Кэш пишет только main, остальные ветки его только читают —
      # так кэш не засоряется сборками экспериментальных веток.
      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.8.2"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # build = компиляция + тесты + сборка jar.
      # Docker на ubuntu-latest уже есть, поэтому Testcontainers работает без настройки.
      - name: Build and test
        run: gradle build --no-daemon --stacktrace

      # Короткая сводка по тестам прямо на странице запуска (вкладка Summary).
      - name: Test summary
        if: always()
        run: |
          dir=services/api/build/test-results/test
          if ! ls "$dir"/TEST-*.xml >/dev/null 2>&1; then
            echo "Тесты не запускались (ошибка раньше, см. лог сборки)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Тесты api"
            echo
            echo "| Класс | Тестов | Упало | Ошибок | Пропущено |"
            echo "|---|---|---|---|---|"
            for f in "$dir"/TEST-*.xml; do
              head=$(grep -m1 '<testsuite ' "$f")
              name=$(echo "$head"   | sed -E 's/.* name="([^"]*)".*/\1/' | sed 's/.*\.//')
              tests=$(echo "$head"  | sed -E 's/.* tests="([0-9]+)".*/\1/')
              fail=$(echo "$head"   | sed -E 's/.* failures="([0-9]+)".*/\1/')
              err=$(echo "$head"    | sed -E 's/.* errors="([0-9]+)".*/\1/')
              skip=$(echo "$head"   | sed -E 's/.* skipped="([0-9]+)".*/\1/')
              echo "| $name | $tests | $fail | $err | $skip |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # HTML-отчёт тестов — скачать из запуска, если что-то упало.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: api-test-report
          path: backend/services/api/build/reports/tests/test
          retention-days: 14
          if-no-files-found: ignore